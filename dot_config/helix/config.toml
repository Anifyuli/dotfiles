theme = "gruvbox"

[editor]
bufferline = "always"
color-modes = true
cursorline = true
auto-completion = true
end-of-line-diagnostics = "hint"

[editor.indent-guides]
render = true
character = "┆"

[editor.soft-wrap]
enable = true

[editor.lsp]
display-messages = true
display-inlay-hints = true
display-progress-messages = true

[editor.inline-diagnostics]
cursor-line = "warning"

[editor.statusline]
left = ["spacer", "mode", "spinner"]
center = ["version-control", "spacer", "separator", "file-name", "file-modification-indicator"]
right = ["diagnostics", "selections", "separator", "position", "separator", "file-encoding", "file-line-ending", "separator", "total-line-numbers", "separator", "file-type"]
separator = "»"

[editor.statusline.mode]
normal = "NORMAL"
insert = "INSERT"
select = "SELECT"

[editor.smart-tab]
enable = true

[keys.normal.b]
d = ":buffer-close"
D = ":buffer-close-all"
