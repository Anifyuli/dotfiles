set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sidebar'
set -g @plugin 'tmux-plugins/tmux-sensible' # optional recommended
set -g @plugin 'erikw/tmux-powerline'
# set -g @plugin 'egel/tmux-gruvbox'  # disabled - conflicts with tmux-powerline
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# tmux-resurrect & continuum
set -g @continuum-restore 'off'
set -g @continuum-save-interval '15'
set -g @resurrect-hook-post-save 'tmux display-message "  Session saved"'

# vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
bind -n 'C-\' if-shell "$is_vim" 'send-keys C-\\' 'select-pane -l'

# set -g @tmux-gruvbox 'dark'
set -g clock-mode-style 24
set -g mouse on

run "~/.tmux/plugins/tpm/tpm"

# Message & confirmation styles — detect light/dark mode from KDE
if-shell 'grep -qE "LookAndFeelPackage.*light|ColorScheme.*Light" ~/.config/kdeglobals 2>/dev/null' {
  set -g message-style "fg=#3c3836,bg=#d5c4a1"
  set -g message-command-style "fg=#3c3836,bg=#d5c4a1"
} {
  set -g message-style "fg=#ebdbb2,bg=#504945"
  set -g message-command-style "fg=#ebdbb2,bg=#504945"
}
