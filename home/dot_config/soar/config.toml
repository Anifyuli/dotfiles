# Soar package manager configuration
# Managed by chezmoi - see ~/.local/share/chezmoi/home/dot_config/soar/config.toml

default_profile = "default"

parallel = true
parallel_limit = 4
ghcr_concurrency = 8
search_limit = 20
cross_repo_updates = false

desktop_integration = true

sync_interval = "3h"

completions = ["fish"]

portable_dirs = "$HOME/AppImages"

[display]
progress_style = "modern"
icons = true
spinners = true

[profile.default]
root_path = "~/.local/share/soar"

[[repositories]]
