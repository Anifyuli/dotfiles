[tools]
gradle = "latest"
node   = "latest"
pnpm   = "latest"
yarn   = "latest"
usage  = "latest"
uv     = "latest"

# npm packages
"npm:@mistweaverco/kulala-ls"   = "latest"
"npm:@mistweaverco/kulala-fmt"  = "latest"
"npm:@nestjs/cli"               = "latest"
"npm:prettier"                  = "latest"
"npm:httpyac"                   = "latest"
"npm:eas-cli"                   = "latest"
"npm:opencode-ai"               = { version = "1.16.2", npm_args = "--ignore-scripts=false --allow-scripts=opencode-ai" }

[settings]
experimental = true
node.corepack = true
npm.package_manager = "npm"
