packages:
  copr_common:
    - anifyuliansyah/ab-download-manager
    - birkch/QDiskInfo
    - jdxcode/mise
    - taw/joplin
  copr:
    ThinkPad-L15G2a:
      - anifyuliansyah/thinkpad-l15g2a-suspend-fix
      - whitehara/kernel-tkg-zen2-preempt
    ThinkPad-X280:
      - bieszczaders/kernel-cachyos
      - whitehara/kernel-cachyos-preempt
  dnf_common:
    - btop
    - fastfetch
    - glow
    - kitty
    - tmux
    - ibm-plex-fonts-all
    - ibmplexmono-nerd-fonts
    - nerdfontssymbolsonly-nerd-fonts
  # A "repo:package" entry installs `package` only once the installed
  # package's release matches a tag derived from `repo` (strip a leading
  # "kernel-" and turn "-" into "_"), instead of the plain rpm -q guard —
  # for packages whose name doesn't change when sourced from a Copr repo.
  dnf:
    ThinkPad-L15G2a:
      - kernel-tkg-zen2-preempt:kernel
      - kernel-tkg-zen2-preempt:kernel-devel
      - kernel-tkg-zen2-preempt:kernel-modules-extra
    ThinkPad-X280:
      - kernel-cachyos
      - kernel-cachyos-core
      - kernel-cachyos-devel-matched
      - kernel-cachyos-preempt:kernel
      - kernel-cachyos-preempt:kernel-devel
      - kernel-cachyos-preempt:kernel-modules-extra
